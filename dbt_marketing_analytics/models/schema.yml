version: 2

models:
  - name: stg_customers
    description: "Cleaned and standardized customer records with acquisition metadata."
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: acquisition_channel
        description: "Channel through which the customer was acquired (email, paid_social, organic, referral)"
        tests:
          - not_null
          - accepted_values:
              values: ['email', 'paid_social', 'organic', 'referral']
      - name: plan_tier
        description: "Customer subscription tier"
        tests:
          - accepted_values:
              values: ['basic', 'premium']

  - name: stg_transactions
    description: "Cleaned transaction records with net amount calculation."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: net_amount
        description: "Revenue amount excluding refunds. Zero for refunded transactions."
        tests:
          - not_null

  - name: stg_campaign_spend
    description: "Cleaned campaign spend records by channel and date."
    columns:
      - name: campaign_id
        description: "Unique campaign identifier"
        tests:
          - unique
          - not_null

  - name: mart_cac
    description: "Customer Acquisition Cost by channel and acquisition month. CAC = total spend / new customers acquired."
    columns:
      - name: channel
        description: "Marketing channel"
      - name: acquisition_month
        description: "Month of customer acquisition"
      - name: new_customers
        description: "Number of new customers acquired via this channel in this month"
      - name: total_spend
        description: "Total campaign spend for this channel in this month (USD)"
      - name: cac_usd
        description: "Customer Acquisition Cost in USD"

  - name: mart_ltv
    description: "Customer Lifetime Value — total net revenue per customer with segmentation."
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: ltv_usd
        description: "Total net revenue generated by this customer to date"
      - name: ltv_tier
        description: "LTV segmentation tier: high (>=150), medium (>=50), low (<50)"

  - name: mart_cohort_retention
    description: "Monthly cohort retention rates showing what % of each acquisition cohort remains active."
    columns:
      - name: cohort_month
        description: "Month in which the cohort was acquired"
      - name: months_since_acquisition
        description: "Number of months since acquisition (0 = acquisition month)"
      - name: retention_rate_pct
        description: "Percentage of original cohort still active in this month"

  - name: mart_churn_risk
    description: "Rule-based churn risk scoring based on recency of last transaction."
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: churn_risk
        description: "Risk tier: high (>60 days inactive), medium (>30 days), low (<30 days)"
        tests:
          - accepted_values:
              values: ['high', 'medium', 'low']
